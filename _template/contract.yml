# Copy to <your-pg-id>/<dataset>.yml and fill in.
#
# The schema block is the easy half. The guarantees, change policy and semantics
# are what make this a contract rather than a description.

name: orders
version: 1.0.0
description: >
  One row per customer order at the point it was placed. Does not reflect later
  cancellation — see `order_status_changes` for that.

owner:
  name: Your Name
  platform_id: pg0025
  contact: you@example.com

source:
  system: kafka
  location: pg0025.orders
  format: json

guarantees:
  freshness: events land within 5 minutes of being produced
  completeness: every order placed appears exactly once
  uniqueness: order_id
  # Only promise what you can actually hold to. An unmet guarantee is worse than
  # an absent one, because someone will have built on it.

change_policy:
  additive: allowed without notice      # new optional columns
  rename: requires a new major version
  type_change: requires a new major version
  removal: requires a new major version and 30 days notice

schema:
  - name: order_id
    type: string
    required: true
    description: Unique per order. Assigned by the ordering system, not by us.

  - name: customer_id
    type: string
    required: true
    description: Joins to customers.customer_id.

  - name: order_status
    type: string
    required: true
    description: >
      P = placed, C = confirmed, X = cancelled at point of sale.
      NOT the current status of the order; this is its status when placed.
      # This kind of note is the whole point. A reader who assumes C means
      # "complete" will build something quietly wrong.

  - name: order_total
    type: decimal(12,2)
    required: true
    description: Gross, in the currency of `currency`. Excludes shipping.

  - name: currency
    type: string
    required: true
    description: ISO 4217, uppercase.

  - name: placed_at
    type: timestamp
    required: true
    description: UTC. Always carries a zone marker.
