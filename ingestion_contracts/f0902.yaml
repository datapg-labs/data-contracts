          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban06:
        type: integer
        description: 'Period 06 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban07:
        type: integer
        description: 'Period 07 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban08:
        type: integer
        description: 'Period 08 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban09:
        type: integer
        description: 'Period 09 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
