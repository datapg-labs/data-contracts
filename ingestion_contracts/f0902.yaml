          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban05:
        type: integer
        description: 'Period 05 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
