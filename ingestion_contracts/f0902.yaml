dataContractSpecification: 1.1.0
id: urn:datacontract:jde:e1:f0902
info:
  title: JD Edwards EnterpriseOne F0902
  version: 1.1.0
  description: 'Account Balances (JD Edwards EnterpriseOne 9.2). Values are stored in RAW JDE encoding:
    julian dates and implied-decimal integers are NOT dates and decimals in storage. SAP counterpart:
    no SAP equivalent - summarised balances, rewritten by posting.'
  owner: Finance Data Engineering Team
models:
  f0902:
    type: table
    fields:
      gbaid:
        type: string
        description: 'Account ID. Part of the JDE primary key. SAP counterpart: RACCT. Physical type in
          the lakehouse: varchar.'
        primary_key: true
        required: true
      gblt:
        type: string
        description: 'Ledger Type. Part of the JDE primary key. SAP counterpart: RLDNR. Physical type
          in the lakehouse: varchar.'
        primary_key: true
        required: true
      gbfy:
        type: integer
        description: 'Fiscal Year. Part of the JDE primary key. SAP counterpart: GJAHR. Physical type
          in the lakehouse: bigint.'
        primary_key: true
        required: true
      gbctry:
        type: integer
        description: 'Century. Part of the JDE primary key. JDE-only; JDE splits century from year. Physical
          type in the lakehouse: bigint.'
        primary_key: true
        required: true
      gbsbl:
        type: string
        description: 'Subledger. Part of the JDE primary key. SAP counterpart: ANLN1. Physical type in
          the lakehouse: varchar.'
        primary_key: true
        required: true
      gbsblt:
        type: string
        description: 'Subledger Type. Part of the JDE primary key. JDE-only; qualifies what GBSBL points
          at. Physical type in the lakehouse: varchar.'
        primary_key: true
        required: true
      gbco:
        type: string
        description: 'Company. SAP counterpart: RBUKRS. Physical type in the lakehouse: varchar.'
      gbmcu:
        type: string
        description: 'Business Unit. SAP counterpart: RCNTR. Physical type in the lakehouse: varchar.'
      gbobj:
        type: string
        description: 'Object Account. SAP counterpart: RACCT. Physical type in the lakehouse: varchar.'
      gbsub:
        type: string
        description: 'Subsidiary. SAP counterpart: RACCT. Physical type in the lakehouse: varchar.'
      gbcrcd:
        type: string
        description: 'Currency Code. SAP counterpart: RTCUR. Physical type in the lakehouse: varchar.'
      gbapyc:
        type: integer
        description: 'Prior Year Cumulative. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. JDE-only; JDE prior-year cumulative. Physical type in
          the lakehouse: bigint.'
      gban01:
        type: integer
        description: 'Period 01 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban02:
        type: integer
        description: 'Period 02 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban03:
        type: integer
        description: 'Period 03 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
          places (divide by 10^2 to get the real value). Not a decimal in storage; a model that unions
          it against a true DECIMAL must cast it. SAP counterpart: HSL. Physical type in the lakehouse:
          bigint.'
      gban04:
        type: integer
        description: 'Period 04 Net Posting. Monetary amount stored RAW as an integer with 2 implied decimal
