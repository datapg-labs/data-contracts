dataContractSpecification: 1.1.0
id: urn:datacontract:sap:s4:bsak

info:
  title: SAP S/4HANA BSAK
  version: 1.1.0
  description: Vendor cleared items. Contains accounts payable transactions that have been settled through payments or clearing transactions.
  owner: Finance Data Engineering Team

models:
  bsak:
    type: table

    fields:

      mandt:
        type: string
        description: SAP client.
        primary_key: true

      bukrs:
        type: string
        description: Company code.
        primary_key: true

      lifnr:
        type: string
        description: Vendor account number.
        primary_key: true

      belnr:
        type: string
        description: Accounting document number.
        primary_key: true

      gjahr:
        type: string
        description: Fiscal year.
        primary_key: true

      buzei:
        type: string
        description: Accounting document line item.
        primary_key: true

      augbl:
        type: string
        description: Clearing document number.

      augdt:
        type: string
        description: Clearing date.

      auggj:
        type: string
        description: Clearing fiscal year.

      budat:
        type: string
        description: Posting date.

      bldat:
        type: string
        description: Document date.

      blart:
        type: string
        description: Document type.

      waers:
        type: string
        description: Document currency.

      dmbtr:
        type: number
        description: Amount in local currency.

      wrbtr:
        type: number
        description: Amount in document currency.

      shkzg:
        type: string
        description: Debit or credit indicator.

      zterm:
        type: string
        description: Payment terms.

      zfbdt:
        type: string
        description: Baseline date.

      netdt:
        type: string
        description: Net due date.

      hbkid:
        type: string
        description: House bank.

      zlsch:
        type: string
        description: Payment method.

      zlspr:
        type: string
        description: Payment block.

      xblnr:
        type: string
        description: Vendor invoice reference.

      sgtxt:
        type: string
        description: Item text.

      zuonr:
        type: string
        description: Assignment number.

      gsber:
        type: string
        description: Business area.

      prctr:
        type: string
        description: Profit center.

      segment:
        type: string
        description: Segment.

      ekorg:
        type: string
        description: Purchasing organization.

      ekgrp:
        type: string
        description: Purchasing group.

      werks:
        type: string
        description: Plant.

      land1:
        type: string
        description: Vendor country.

      regio:
        type: string
        description: Vendor region.

      business_partner_type:
        type: string
        description: VENDOR.

      open_cleared_status:
        type: string
        description: CLEARED.

      clearing_age_days:
        type: integer
        description: Number of days between posting date and clearing date.

      __op:
        type: string
        description: CDC operation type.

      __ts:
        type: integer
        description: CDC processing timestamp.