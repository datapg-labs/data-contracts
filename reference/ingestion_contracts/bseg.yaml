quality:
  type: soda
  checks:
  - name: primary_key_uniqueness
    description: BSEG composite key must be unique.
    rule: 'duplicate_count(mandt, bukrs, gjahr, belnr, buzei) = 0

      '
  - name: mandatory_key_fields
    description: Primary key fields cannot be null.
    rule: 'missing_count(mandt) = 0 AND missing_count(bukrs) = 0 AND missing_count(gjahr)
      = 0 AND missing_count(belnr) = 0 AND missing_count(buzei) = 0

      '
  - name: valid_debit_credit_indicator
    description: Debit/Credit indicator must be valid.
    rule: 'invalid_count(shkzg NOT IN (''S'',''H'')) = 0

      '
  - name: currency_amount_validation
    description: Document amount cannot be null.
    rule: 'missing_count(wrbtr) = 0

      '
  - name: fiscal_year_validation
    description: Fiscal year must be valid.
    rule: 'invalid_count(length(gjahr) <> 4) = 0

      '
servicelevels:
  freshness:
    threshold: P1D
  retention:
    period: P7Y
  availability:
    percentage: 99.5%
