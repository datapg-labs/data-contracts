dataContractSpecification: 1.1.0
id: urn:datacontract:sap:s4:bseg
info:
  title: SAP S/4HANA BSEG Accounting Document Segment
  version: 1.0.0
  description: 'SAP S/4HANA BSEG table containing accounting document line items.
    Stores detailed financial posting information including GL accounts, customer/vendor
    postings, tax, currencies, payment information, and controlling dimensions.

    '
  owner: Finance Data Engineering Team
servers:
  production:
    type: sap
    environment: prod
terms:
  usage: 'Internal enterprise financial reporting, reconciliation, audit, and analytics
    use only.

    '
models:
  bseg:
    type: table
    description: 'One record per accounting document line item in SAP FI.

      '
    primaryKey:
